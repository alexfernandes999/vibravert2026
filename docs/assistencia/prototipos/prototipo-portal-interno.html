<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Interno da Assistência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
/* Layout: aplicativo de trabalho com barra lateral fixa (navegação + contadores) e área principal; mesma identidade do site, com mais densidade de informação. */
:root{
  --night:#0A1B4D; --navy:#14307A; --brand:#13357F; --steel:#545452;
  --ink:#12172A; --muted:#5d6579; --line:#dfe4ee; --ground:#F2F5FA; --paper:#ffffff; --soft:#f6f8fc; --tint:#E3EAF8;
  --sun:#F5B921; --sun-ink:#5C4100; --sun-bg:#fff6dc;
  --ok:#1f7a4d; --ok-bg:#e2f4ea; --warn:#8a5d00; --warn-bg:#fdf1d2; --bad:#9b2c2c; --bad-bg:#f9e3e3; --info:#13357F; --info-bg:#e6edfb;
  --f:"Red Hat Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Red Hat Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.strip{background:var(--sun-bg);color:var(--sun-ink);font:600 12.5px/1.4 var(--f);text-align:center;padding:6px 16px;border-bottom:1px solid #f0dca0}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 31px)}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}}

/* Barra lateral */
aside.side{background:var(--night);color:#cfd7ee;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
@media (max-width:900px){aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px}}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 6px}
.brand b{font:800 22px/1 var(--f);color:#fff;letter-spacing:.01em}
.brand i{display:block;height:2.5px;background:#9aa0ad}
.brand i+i{background:var(--sun)}
.brand span{font:600 11px/1.3 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--sun);margin-top:4px}
.nav{display:grid;gap:2px}
@media (max-width:900px){.nav{display:flex;flex-wrap:wrap;gap:4px}.navlbl,.side-foot{display:none}}
.navlbl{font:700 10.5px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:#7f8bb0;padding:10px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#cfd7ee;font:600 14px/1 var(--f);padding:10px;border-radius:8px;cursor:pointer;text-align:left}
@media (max-width:900px){.nav button{width:auto}}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:#fff;color:var(--night)}
.nav button.on svg{opacity:1}
.nav .cnt{margin-left:auto;font:700 11.5px/1 var(--f);padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
.nav button.on .cnt{background:var(--tint);color:var(--brand)}
.nav .cnt.hot{background:var(--sun);color:var(--sun-ink)}
.side-foot{margin-top:auto;font-size:12px;color:#8e99bd;padding:0 8px;line-height:1.5}

/* Topo */
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
@media (max-width:900px){.top{position:static;padding:12px 16px;flex-wrap:wrap}}
.top .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.top .search input{border:0;background:transparent;font:500 14px/1 var(--f);width:100%;color:var(--ink);outline:none}
.claude-pill{display:inline-flex;align-items:center;gap:8px;font:700 12.5px/1 var(--f);padding:8px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.claude-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,122,77,.18)}
.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.user b{display:block;color:var(--ink);font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 13px/1 var(--f)}

main{padding:26px 28px 80px;min-width:0}
@media (max-width:900px){main{padding:20px 16px 80px}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font:800 24px/1.2 var(--f);margin:0;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted)}
.crumb{background:none;border:0;padding:0;font:600 13.5px/1 var(--f);color:var(--brand);cursor:pointer;margin-bottom:10px}

/* Componentes */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>.hd h3{margin:0;font:800 15.5px/1.3 var(--f)}
.card>.bd{padding:16px 18px}
.grid{display:grid;gap:16px;align-content:start}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2>.card{align-self:start}
@media (max-width:1050px){.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;min-width:0;cursor:pointer;text-align:left;font-family:inherit}
.kpi:hover{border-color:#a9b8d8}
.kpi span{font:600 12.5px/1.3 var(--f);color:var(--muted)}
.kpi b{font:800 28px/1 var(--f);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--sun);background:var(--sun-bg)}
.kpi.alert b{color:var(--sun-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1.5 var(--f);padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:#eef0f5;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:800 13.5px/1 var(--f);padding:11px 15px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.line{background:var(--paper);border-color:var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--brand)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:700 11px/1.3 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f8faff}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
.stripe{width:4px;border-radius:2px;align-self:stretch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font:700 12.5px/1 var(--f);cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--brand);background:var(--tint);color:var(--brand)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* Fila */
.qitem{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.qitem:last-child{border-bottom:0}
.qitem:hover{background:#f8faff}
.qitem .bar{height:100%;min-height:44px;border-radius:3px}
.qitem h4{margin:0;font:700 14.5px/1.3 var(--f)}
.qitem p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.qmeta{text-align:right;font-size:12.5px;color:var(--muted);display:grid;gap:4px;justify-items:end}
.sla{font:700 12.5px/1 var(--f);color:var(--warn)}
.sla.late{color:var(--bad)}

/* Ficha do chamado */
.casehead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.casehead .num{font:500 26px/1.1 var(--mono);color:var(--brand)}
.casehead .who{font:700 16px/1.3 var(--f);margin-top:4px}
.casehead .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sugg{border-radius:12px;padding:18px;display:grid;gap:10px}
.sugg.bad{background:var(--bad-bg);border:1.5px solid #e9b9b9}
.sugg.warn{background:var(--warn-bg);border:1.5px solid #ecd28e}
.sugg.ok{background:var(--ok-bg);border:1.5px solid #b4dcc5}
.sugg .who{display:flex;align-items:center;gap:8px;font:800 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase}
.sugg h3{margin:0;font:800 18px/1.3 var(--f)}
.sugg p{margin:0;font-size:14.5px}
.kv{display:grid;grid-template-columns:minmax(130px,auto) minmax(0,1fr);gap:7px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.sig{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.sig li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ph-t{display:grid;gap:6px;min-width:0}
.ph-t .img{aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;background:#e6ecf7}
.ph-t .img img{width:100%;height:100%;object-fit:cover;display:block}
.ph-t .img .tagc{position:absolute;left:6px;top:6px}
.ph-t b{font:700 13px/1.2 var(--f)}
.ph-t small{font-size:12px;color:var(--muted)}
.ph-t.flag .img{border:2.5px solid var(--bad)}
.lf{display:grid;gap:8px}
.lf div{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.actbox{display:grid;gap:12px}
.actbox textarea,.actbox select,.fld textarea,.fld select,.fld input{width:100%;font:400 14.5px/1.4 var(--f);padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fbfcfe;color:var(--ink)}
.actbox textarea,.fld textarea{min-height:84px;resize:vertical}
.actbox label,.fld label{font:700 13.5px/1.3 var(--f);display:block;margin-bottom:6px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);flex:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{display:grid;grid-template-columns:110px 92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.hist li:last-child{border-bottom:0}
@media (max-width:640px){.hist li{grid-template-columns:minmax(0,1fr)}}
.hist .t{font:500 12px/1.6 var(--mono);color:var(--muted)}
.auth{font:700 11px/1.6 var(--f);text-transform:uppercase;letter-spacing:.08em}
.auth.c{color:#7a3fb0}.auth.m{color:var(--muted)}.auth.p{color:var(--brand)}
.msgdraft{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;white-space:pre-wrap}
.devnote{border:1.5px dashed #a9b6d6;border-radius:8px;padding:10px 12px;font:500 12.5px/1.5 var(--mono);color:var(--muted);background:#fafbff}
.devnote b{display:block;color:var(--sun-ink);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin-bottom:2px}
.nfbox{font:500 13px/1.6 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.nfbox span{padding:1px 2px;border-radius:3px}
.nfbox .c1{background:#e6edfb}.nfbox .c2{background:#fdf1d2}.nfbox .c3{background:#e2f4ea}.nfbox .c4{background:#f3e6fb}

/* Bancada */
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bitem{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.bitem .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bitem h4{margin:0;font:700 15px/1.3 var(--f)}
.clock{font:500 22px/1 var(--mono)}
.clock.late{color:var(--bad)}
.meter{height:6px;border-radius:3px;background:#e9edf5;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand)}
.meter i.late{background:var(--bad)}
.meter i.mid{background:var(--sun)}

/* Conversas */
.inbox{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:520px}
@media (max-width:820px){.inbox{grid-template-columns:minmax(0,1fr)}}
.threads{border-right:1px solid var(--line)}
.th{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:3px;cursor:pointer}
.th:hover{background:#f8faff}
.th.on{background:var(--tint)}
.th .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.th b{font-size:14px}
.th small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.chan{font:700 10px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-width:0}
.chat .msgs{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.msg{max-width:78%;padding:10px 13px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:14px}
.msg .w{display:block;font:600 11px/1.4 var(--mono);color:var(--muted);margin-bottom:2px}
.msg.out{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand)}
.msg.out .w{color:#c9d2ea}
.msg.ai{align-self:flex-end;background:#f3ecfb;border-color:#dccbf0}
.sysm{align-self:center;font:600 12px/1.4 var(--f);background:var(--warn-bg);color:var(--warn);padding:6px 12px;border-radius:999px}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;flex-wrap:wrap}
.composer input{flex:1;min-width:160px;font:400 14.5px/1 var(--f);padding:11px 12px;border:1.5px solid var(--line);border-radius:8px}

/* Claude */
.tog{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog b{display:block;font-size:14.5px}
.tog small{color:var(--muted);font-size:13px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#cfd6e4;transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--brand)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:disabled{cursor:not-allowed}
.sw input:disabled+span{opacity:.6}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:52px 22px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.log li:last-child{border-bottom:0}
.log .t{font:500 12.5px/1.6 var(--mono);color:var(--muted)}
.log .d{width:10px;height:10px;border-radius:50%;margin-top:6px}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.barrow .tr{height:12px;background:#edf0f6;border-radius:6px;overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:6px}
.barrow b{text-align:right;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font:600 14px/1.35 var(--f);padding:12px 16px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(10,27,77,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:14px;max-width:560px;width:100%;padding:22px;display:grid;gap:14px;max-height:90vh;overflow:auto}
.modal h3{margin:0;font:800 18px/1.3 var(--f)}

/* Modo bancada */
.recv{display:grid;gap:12px}
.scan{display:flex;gap:10px;align-items:center;border:2px solid var(--brand);border-radius:12px;padding:6px 6px 6px 14px;background:#fff}
.scan svg{flex:none;color:var(--brand)}
.scan input{flex:1;min-width:0;border:0;outline:none;font:600 17px/1.2 var(--f);padding:10px 0;color:var(--ink);background:transparent}
.hints{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.hints button{border:1px dashed #a9b6d6;background:var(--soft);border-radius:6px;padding:4px 8px;font:500 12px/1.2 var(--mono);color:var(--brand);cursor:pointer}
.res{display:grid;gap:8px}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.ritem b{font-size:14.5px}
.ritem small{display:block;color:var(--muted);font-size:13px}
.bform{display:grid;gap:18px}
.bsec h4{margin:0 0 10px;font:800 13px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0}
@media (max-width:640px){.brow{grid-template-columns:minmax(0,1fr)}}
.brow>span{font:600 14px/1.3 var(--f)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg label{position:relative}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg span{display:inline-block;padding:9px 13px;border:1.5px solid var(--line);border-radius:8px;font:700 13.5px/1.1 var(--f);background:#fbfcfe;cursor:pointer}
.tg input:checked+span{border-color:var(--brand);background:var(--tint);color:var(--brand)}
.tg input:checked+span.neg{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.tg input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.meas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.meas{grid-template-columns:minmax(0,1fr)}}
.meas label{font:600 13px/1.3 var(--f);display:grid;gap:5px}
.meas input{font:600 16px/1 var(--mono);padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;width:100%}
.draft{background:#fff;border:1px solid #cfd6e4;border-radius:6px;box-shadow:0 6px 18px rgba(10,27,77,.08);padding:18px;font-size:13.5px;line-height:1.55;display:grid;gap:8px}
.draft h5{margin:6px 0 0;font:800 11.5px/1.2 var(--f);color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.draft p{margin:0}
.draft .ban{color:#fff;font:800 12.5px/1.3 var(--f);padding:9px 12px;border-radius:4px;letter-spacing:.02em}
.draft blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--sun);background:var(--sun-bg);font-style:italic}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:10px;border:1.5px solid}

/* E-mail */
.mailbox{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:560px}
@media (max-width:900px){.mailbox{grid-template-columns:minmax(0,1fr)}}
.mlist{border-right:1px solid var(--line)}
.mitem{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:3px;cursor:pointer}
.mitem:hover{background:#f8faff}
.mitem.on{background:var(--tint)}
.mitem.unread b{font-weight:800}
.mitem .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mitem .r b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .r time{font:500 12px/1 var(--mono);color:var(--muted);flex:none}
.mitem .sj{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mread{display:grid;align-content:start;gap:14px;padding:18px 20px;min-width:0}
.mhead h2{margin:0 0 6px;font:800 19px/1.3 var(--f)}
.mhead .from{font-size:13.5px;color:var(--muted)}
.mhead .from b{color:var(--ink)}
.mbody{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px}
.mbody.reply{background:#f3ecfb;border-color:#dccbf0}
.mclass{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-radius:10px;background:#faf7fe;border:1px solid #e6dbf5;font-size:13.5px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.mcomp{display:grid;gap:8px}
.mcomp textarea{width:100%;min-height:140px;font:400 14.5px/1.5 var(--f);padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;resize:vertical}

/* ---------- Painel ---------- */

  var cnt=function(s){return C.filter(function(c){return c.status===s;}).length;};
  var res=[['Liberados automaticamente',auto,'#13357F'],['Na fila de decisão',fila().length,'#F5B921'],['Pendentes do cliente',cnt('pendente'),'#c9a24a'],['Fora do fluxo',cnt('fora'),'#9aa3b5']];
  var mx=Math.max.apply(null,res.map(function(r){return r[1];}))||1;
  return '<div class="ph"><div><h1>Painel do dia</h1><p>'+TODAY.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})+' · atualizado às 09:42</p></div><button class="btn sun" data-v="fila">Abrir fila de decisão ('+fila().length+')</button></div>'+
  '<div class="kpis">'+
    kpi('Chamados abertos hoje',hoje.length,'pelo formulário do site','chamados')+

    kpi('Liberados automaticamente',auto,'aprovações e autorizações','chamados')+
    kpi('Na bancada',cnt('bancada'),benchLate?benchLate+' com prazo vencendo':'dentro do prazo de 48 h','bancada',benchLate>0)+
    kpi('Conversas com humano',CONV.filter(function(c){return c.esc;}).length,'WhatsApp e chat escalados','conversas',true)+
    kpi('E-mails para você',MAILS.filter(function(m){return m.st==='humano';}).length,'de '+MAILS.length+' recebidos hoje','email',true)+
  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><div class="hd"><h3>Precisa de você agora</h3><span class="muted" style="font-size:13px">Ordenado pelo prazo</span></div>'+filaList(fila().slice().sort(function(a,b){return a.aberto-b.aberto;}))+'</div>'+
    '<div class="grid">'+
      '<div class="card"><div class="hd"><h3>Resultado dos chamados de hoje</h3></div><div class="bd"><div class="bars">'+res.map(function(r){return '<div class="barrow"><span>'+r[0]+'</span><span class="tr"><i style="width:'+Math.max(4,r[1]/mx*100)+'%;background:'+r[2]+'"></i></span><b>'+r[1]+'</b></div>';}).join('')+'</div></div></div>'+
      '<div class="card"><div class="hd"><h3>Última atividade da Claude</h3><button class="btn line sm" data-v="claude">Ver tudo</button></div><div class="bd"><ul class="log">'+LOG.slice(0,4).map(logLi).join('')+'</ul></div></div>'+
    '</div>'+
  '</div>';
}
function kpi(l,n,s,v,alert){return '<button type="button" class="kpi'+(alert&&n?' alert':'')+'" data-v="'+v+'"><span>'+l+'</span><b>'+n+'</b><small>'+s+'</small></button>';}
function logLi(l){var col={c:'#7a3fb0',s:'#13357F',p:'#1f7a4d'}[l[1]];return '<li><span class="t">'+l[0]+'</span><span class="d" style="background:'+col+'"></span><span>'+esc(l[2])+'</span></li>';}

/* ---------- Fila ---------- */
function filaList(list){
  if(!list.length)return '<div class="empty">Fila vazia. Nada aguardando decisão.</div>';
  return list.map(function(c){var col=c.sug.tipo==='revisar'?'var(--sun)':'var(--bad)';
    return '<div class="qitem" role="button" tabindex="0" data-p="'+c.p+'"><span class="bar" style="background:'+col+'"></span><div><h4>'+sugPill(c.sug.tipo)+' &nbsp;'+esc(c.sug.txt)+'</h4><p><span class="mono">'+c.p+'</span> · '+esc(c.nome)+' · '+esc(c.modelo)+' · '+FX[c.faixa][0]+'</p></div><div class="qmeta">'+slaTxt(c)+'<span>aberto '+dt(c.aberto)+'</span></div></div>';}).join('');
}
function vFila(){
  var f=fila();
  return '<div class="ph"><div><h1>Fila de decisão</h1><p>Só o que precisa de uma pessoa. Negativas e recusas nunca saem sem a sua confirmação.</p></div></div>'+
  '<div class="card">'+filaList(f.slice().sort(function(a,b){return a.aberto-b.aberto;}))+'</div>'+
  '<p class="muted" style="font-size:13px;margin-top:12px">SLA da fila: 24 horas úteis a partir da abertura. O cliente vê "em análise" enquanto o caso está aqui.</p>';
}

/* ---------- Chamados ---------- */
var FILTROS=[['todos','Todos'],['fila','Na fila'],['liberados','Liberados'],['pendente','Pendentes'],['bancada','Bancada'],['concluidos','Concluídos'],['fora','Fora do fluxo']];
function match(c,f){if(f==='todos')return true;if(f==='liberados')return c.status==='autorizado'||c.status==='aprovado'||c.status==='negado';if(f==='bancada')return c.status==='bancada'||c.status==='aguardando';if(f==='concluidos')return c.status==='garantia_ok'||c.status==='garantia_neg';return c.status===f;}
function vChamados(){
  var q=($('#q').value||'').toLowerCase().trim();
  var list=C.filter(function(c){return match(c,S.filtro)&&(!q||(c.p+' '+c.nome+' '+c.doc+' '+c.nf).toLowerCase().indexOf(q)>-1);}).sort(function(a,b){return b.aberto-a.aberto;});
  return '<div class="ph"><div><h1>Chamados</h1><p>Todos os chamados abertos pelo site.</p></div></div>'+
  '<div class="filters">'+FILTROS.map(function(f){return '<button type="button" class="chip'+(S.filtro===f[0]?' on':'')+'" data-filtro="'+f[0]+'">'+f[1]+'</button>';}).join('')+'</div>'+
  '<div class="card tblw"><table><thead><tr><th>Protocolo</th><th>Cliente</th><th>Produto</th><th>Canal</th><th>Faixa</th><th>Status</th><th>Aberto</th></tr></thead><tbody>'+
  (list.length?list.map(function(c){return '<tr data-p="'+c.p+'" tabindex="0"><td class="mono nw">'+c.p+'</td><td>'+esc(c.nome)+'</td><td class="nw">'+esc(c.modelo)+'</td><td class="nw">'+esc(c.canal)+'</td><td>'+pill(FX,c.faixa)+'</td><td>'+pill(ST,c.status)+(c.lib==='auto'?' <span class="pill p-mute" title="Liberado sem intervenção humana">auto</span>':'')+'</td><td class="nw muted">'+dt(c.aberto)+'</td></tr>';}).join(''):'<tr><td colspan="7"><div class="empty">Nenhum chamado com esse filtro'+(q?' e essa busca':'')+'.</div></td></tr>')+
  '</tbody></table></div>';
}

function foto(k,lbl){var key=k+lbl;if(PH[key])return PH[key];var c=document.createElement('canvas');c.width=320;c.height=240;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,320,240);g.addColorStop(0,'#dfe6f4');g.addColorStop(1,'#bfcbe3');x.fillStyle=g;x.fillRect(0,0,320,240);

  else if(k==='etiqueta'){x.fillStyle='#fff';x.fillRect(60,70,200,100);x.fillStyle='#13357F';x.font='bold 22px sans-serif';x.fillText(lbl==='crop'?'BOM':'RYMER',lbl==='crop'?200:110,115);x.font='14px monospace';x.fillStyle='#444';x.fillText('Nº SÉRIE 2609-0412',lbl==='crop'?220:85,148);}
  else{x.beginPath();x.ellipse(160,120,60,85,0,0,Math.PI*2);x.fill();x.fillStyle='#F5B921';x.fillRect(146,22,28,26);}
  x.fillStyle='rgba(10,27,77,.8)';x.font='bold 13px sans-serif';x.fillText('exemplo',10,20);

function lfPill(v){return v==='sim'?'<span class="pill p-bad">Encontrado</span>':v==='inc'?'<span class="pill p-warn">Inconclusivo</span>':'<span class="pill p-ok">Não encontrado</span>';}

  '<div class="mailbox"><div class="mlist">'+(list.length?list.map(function(x){return '<div class="mitem'+(x.id===m.id?' on':'')+(x.lido?'':' unread')+'" data-mail="'+x.id+'" role="button" tabindex="0"><div class="r"><b>'+esc(x.de)+'</b><time>'+x.hora+'</time></div><span class="sj">'+esc(x.assunto)+'</span><small>'+esc(x.corpo)+'</small><span>'+pill(MST,x.st)+'</span></div>';}).join(''):'<div class="empty">Nenhum e-mail aqui.</div>')+'</div>'+
  '<div class="mread"><div class="mhead"><h2>'+esc(m.assunto)+'</h2><div class="from"><b>'+esc(m.de)+'</b> &lt;'+esc(m.email)+'&gt; · hoje '+m.hora+'</div></div>'+
  '<div class="mclass">'+ico('claude').replace('<svg','<svg width="16" height="16" style="color:#7a3fb0"')+'<span>Classificação da Claude: <b>'+esc(m.intent)+'</b></span>'+pill(MST,m.st)+(m.proto?'<span class="pill p-info">'+m.proto+'</span>':'')+'</div>'+
  '<div class="mbody">'+esc(m.corpo)+'</div>'+corpoResp+'</div></div></div>'+
  '<div class="devnote" style="margin-top:12px"><b>Nota para desenvolvimento</b>Fase 2: entrada do sac@ pela API do provedor de e-mail. Regras: status, garantia e dúvida técnica a Claude responde; pedido e nota encaminha para pedido@; reclamação, Procon, advogado ou Reclame Aqui nunca responde sozinha. No protótipo, nada é enviado.</div>';
}

/* ---------- Claude ---------- */
function vClaude(){
  var t=function(k,tit,sub,dis){return '<div class="tog"><div><b>'+tit+'</b><small>'+sub+'</small></div><label class="sw"><input type="checkbox" data-auto="'+k+'"'+(S.auto[k]?' checked':'')+(dis?' disabled':'')+' aria-label="'+tit+'"><span></span></label></div>';};
  return '<div class="ph"><div><h1>Claude</h1><p>O que a Claude faz sozinha, o que ela fez hoje e com quais regras.</p></div></div>'+
  '<div class="grid g2">'+
    '<div class="card"><div class="hd"><h3>Atividade de hoje</h3><span class="muted" style="font-size:13px">'+LOG.length+' ações</span></div><div class="bd"><ul class="log">'+LOG.map(logLi).join('')+'</ul>'+
      '<p class="muted" style="font-size:12.5px;margin:12px 0 0"><span style="color:#7a3fb0">●</span> ação no chamado &nbsp; <span style="color:#13357F">●</span> rotina agendada</p></div></div>'+
    '<div class="grid" style="align-content:start">'+
      '<div class="card"><div class="hd"><h3>O que sai sem você</h3></div><div class="bd">'+
        t('aprov','Aprovações e autorizações de envio','Sem sinal vermelho e lista fechada sem achados')+
        t('pend','Pedido de foto ou dado faltante','Mensagem automática ao cliente')+
        t('mkt','Orientação de marketplace e arrependimento','Fora do fluxo técnico')+
        t('neg','Negativas e recusas','Sempre passam pela fila. Regra fixa do guia',true)+
      '</div></div>'+
      '<div class="card"><div class="hd"><h3>Rotinas agendadas</h3></div><div class="bd"><dl class="kv"><dt>07:45 dias úteis</dt><dd>Relatório do dia: fila, pendências e prazos de bancada</dd><dt>16:45 dias úteis</dt><dd>Lembrete de casos da fila perto do SLA</dd><dt>Segunda 08:00</dt><dd>Resumo da semana: laudos, aprovados, negados, tempo médio</dd></dl></div></div>'+
      '<div class="card"><div class="hd"><h3>Regras em uso</h3></div><div class="bd" style="display:grid;gap:10px"><dl class="kv"><dt>Guia de Laudos</dt><dd>v2 · 08/10/2026</dd><dt>Prazos e Faixas</dt><dd>v1.0 · out/2026</dd><dt>Lista fechada</dt><dd>outra marca, cabo cortado, violado, carcaça quebrada</dd></dl>'+
      '<div class="devnote"><b>Nota para desenvolvimento · como a Claude trabalha</b>1) Motor em tempo real: o servidor chama a API da Claude a cada chamado novo (triagem, foto, texto do laudo). 2) Rotinas e apoio ao operador: a Claude no app, com tarefas agendadas e acesso ao portal por um conector (API do portal), lê a fila, gera relatórios e redige mensagens. As regras ficam no código; a Claude nunca libera negativa.</div></div></div>'+
    '</div>'+
  '</div>';
}

/* ---------- Render e eventos ---------- */
function render(){
  renderNav();
  var v=S.view;
  main.innerHTML=v==='painel'?vPainel():v==='fila'?vFila():v==='chamados'?vChamados():v==='bancada'?vBancada():v==='conversas'?vConversas():v==='claude'?vClaude():v==='laudobanc'?vLaudoBanc():v==='email'?vEmail():vCaso();
}
function go(v){S.view=v;render();window.scrollTo(0,0);}
function abrir(p){S.from=(S.view==='caso'?S.from:S.view);S.sel=p;go('caso');}

document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-cheg]'))){e.stopPropagation();var c=byP(t.getAttribute('data-cheg'));c.status='bancada';c.chegou=D(0,10,0);S.rq='';c.hist.push({t:new Date(),a:'p',x:'Bomba recebida na fábrica. Prazo de 48 h iniciado.'});toast('Chegada registrada. Prazo de 48 h iniciado para '+c.p+'.');render();return;}
  if((t=e.target.closest('[data-bres]'))){S.sel=t.getAttribute('data-bres');S.from='bancada';go('laudobanc');return;}
  if((t=e.target.closest('[data-rq]'))){S.rq=t.getAttribute('data-rq');render();return;}
  if((t=e.target.closest('[data-semid]'))){SEMID.push(t.getAttribute('data-semid'));S.rq='';toast('Registrado como recebimento sem identificação. A Claude vai procurar o cliente.');render();return;}
  if(e.target.id==='bsign'){assinar();return;}
  if((t=e.target.closest('[data-v]'))){go(t.getAttribute('data-v'));return;}
  if((t=e.target.closest('[data-filtro]'))){S.filtro=t.getAttribute('data-filtro');render();return;}
  if((t=e.target.closest('[data-mf]'))){S.mf=t.getAttribute('data-mf');S.mail=null;render();return;}
  if((t=e.target.closest('[data-mail]'))){S.mail=+t.getAttribute('data-mail');render();return;}
  if((t=e.target.closest('[data-msend]'))){var mm=MAILS.filter(function(x){return x.id===+t.getAttribute('data-msend');})[0];var tx=$('#mrep').value.trim();if(tx.length<10){$('#mrep').style.borderColor='var(--bad)';$('#mrep').focus();return;}mm.resp=tx;mm.st='resp_op';toast('Resposta registrada para '+mm.de+'. No sistema real, sai pelo sac@.');render();return;}
  if((t=e.target.closest('[data-massume]'))){var m2=MAILS.filter(function(x){return x.id===+t.getAttribute('data-massume');})[0];m2.rasc='';m2.st='humano';render();$('#mrep').focus();return;}
  if((t=e.target.closest('[data-conv]'))){S.conv=+t.getAttribute('data-conv');render();return;}
  if((t=e.target.closest('[data-assumir]'))){var cv=CONV.filter(function(x){return x.id===+t.getAttribute('data-assumir');})[0];cv.esc=true;cv.msgs.push(['sys',hm(new Date()),'Operador assumiu a conversa']);render();return;}
  if((t=e.target.closest('[data-act]'))){acao(t.getAttribute('data-act'));return;}
  if((t=e.target.closest('[data-p]'))){abrir(t.getAttribute('data-p'));return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){var t=e.target.closest('[data-p],[data-conv],[data-mail]');if(t)t.click();}});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='rq'){S.rq=t.value;$('#rres').innerHTML=recvResults(t.value.trim());return;}
  if(S.view==='laudobanc'){var c=byP(S.sel);if(t.matches('[data-bn]'))c.banc[t.getAttribute('data-bn')]=t.value;if(t.matches('[data-bt]'))c.banc.obs=t.value;refreshDraft();}
});
document.addEventListener('change',function(e){var t=e.target;
  if(S.view==='laudobanc'){var c=byP(S.sel);
    if(t.matches('[data-b]'))c.banc[t.getAttribute('data-b')]=t.value;
    if(t.matches('[data-peca]')){var p=t.getAttribute('data-peca'),i=c.banc.pecas.indexOf(p);if(t.checked&&i<0)c.banc.pecas.push(p);if(!t.checked&&i>-1)c.banc.pecas.splice(i,1);}
    if(t.id==='bfinal')c.banc.final=t.value;
    if(t.id==='bfotos'){c.banc.nf=t.files.length;$('#bfc').textContent=t.files.length+' foto(s) anexada(s)';}
    refreshDraft();return;}
  if(t.matches('[data-auto]')){S.auto[t.getAttribute('data-auto')]=t.checked;toast((t.checked?'Ativado: ':'Desativado: ')+t.closest('.tog').querySelector('b').textContent);}});
document.addEventListener('submit',function(e){if(e.target.id==='cmp'){e.preventDefault();var v=$('#cmpi').value.trim();if(!v)return;var cv=CONV.filter(function(x){return x.id===S.conv;})[0];cv.msgs.push(['out',hm(new Date()),v]);cv.ult=v;render();}});
$('#q').addEventListener('input',function(){if(S.view!=='chamados'){S.view='chamados';S.filtro='todos';}render();$('#q').focus();});

function acao(a){
  var c=byP(S.sel),conf=$('#conf'),par=$('#parecer');
  if(a==='pedir'){c.status='pendente';c.hist.push({t:new Date(),a:'p',x:'Operador pediu mais informação ao cliente.'+(par.value?' Nota: '+par.value:'')});toast('Pedido de informação enviado. Chamado em "pendente cliente".');go('fila');return;}
  if(!conf.checked){conf.closest('.ck').style.color='var(--bad)';conf.focus();toast('Marque que conferiu as fotos e as respostas.');return;}
  if(a==='aprovar'&&c.faixa==='?'){var d=$('#dEmi').value;if(!d){$('#dEmi').style.borderColor='var(--bad)';$('#dEmi').focus();toast('Informe a data de emissão para definir a faixa.');return;}
    c.emissao=new Date(d+'T00:00:00');var n=Math.round((TODAY-c.emissao)/86400000);c.faixa=n<=90?'3190':'91';
    c.hist.push({t:new Date(),a:'p',x:'Data de emissão informada pelo operador: '+fmt(c.emissao)+' ('+n+' dias). Faixa: '+FX[c.faixa][0]+(n<=30?' (revenda não tem Troca Expressa)':'')+'.'});}
  if(a==='confirmar'){c.status='negado';c.hist.push({t:new Date(),a:'p',x:(c.sug.tipo==='recusa'?'Recusa':'Negativa')+' confirmada após conferir as fotos.'+(par.value?' Parecer: '+par.value:'')+' Laudo e mensagem liberados ao cliente.'});toast((c.sug.tipo==='recusa'?'Recusa':'Negativa')+' confirmada. Laudo liberado para '+c.p+'.');}
  else{c.status=c.faixa==='troca'?'autorizado':'aprovado';c.hist.push({t:new Date(),a:'p',x:'Envio aprovado pelo operador.'+(par.value?' Parecer: '+par.value:'')+' Laudo de aprovação liberado ao cliente.'});toast('Envio aprovado. Laudo liberado para '+c.p+'.');}
  render();
}
render();
})();
</script>
</body>
</html>
